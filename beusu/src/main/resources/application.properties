spring.application.name=beusu

server.port=8080

# Conexión a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/tysweb2627usuarios
spring.datasource.username=springuser
spring.datasource.password=1234

# Para que Spring Boot cree/actualice las tablas automáticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# RT-CONF-01: Caducidad del token de confirmación de cuenta (24 horas = 86400000 ms)
app.token.confirmacion.expiration-ms=86400000

# RT-CONF-02: Caducidad independiente del token de recuperación de contraseña (30 minutos = 1800000 ms)
app.token.recuperacion.expiration-ms=1800000

# Secreto JWT para firma y verificación simétrica HS256
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration-ms=86400000

# Gestión de errores uniforme y sin trazas internas (RC-REL-02, DA-ERR-01)
server.error.include-stacktrace=never
server.error.include-message=always

# Configuración de correo (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
# Puedes sustituir por tus credenciales de Gmail o pasarlas como variables de entorno
spring.mail.username=${MAIL_USERNAME:tu_correo@gmail.com}
spring.mail.password=${MAIL_PASSWORD:tu_contraseña_de_aplicacion}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
